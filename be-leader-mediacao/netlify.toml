[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
 
[build.environment]
  NODE_VERSION = "22"
 
[functions]
  node_bundler = "esbuild"
 
# Aplicação de página única: qualquer rota volta para o index.html.
# As funções em /.netlify/functions/* não são afetadas por esta regra.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
 
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
 
